<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #09090b;
      color: white;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .logo-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #10b981, #059669);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-icon svg { width: 20px; height: 20px; }
    .logo-text h1 { font-size: 16px; font-weight: 600; }
    .logo-text p { font-size: 11px; color: #71717a; }
    
    .status {
      padding: 12px;
      background: #18181b;
      border-radius: 8px;
      margin-bottom: 12px;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .status-row:last-child { margin-bottom: 0; }
    .status-label { font-size: 12px; color: #a1a1aa; }
    .status-value { font-size: 14px; font-weight: 600; }
    .status-value.connected { color: #10b981; }
    .status-value.disconnected { color: #ef4444; }
    
    .btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #10b981, #059669);
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 8px;
    }
    .btn:hover { opacity: 0.9; }
    .btn.secondary {
      background: #27272a;
      border: 1px solid #3f3f46;
    }
    
    .credits {
      text-align: center;
      padding: 12px;
      background: #18181b;
      border-radius: 8px;
    }
    .credits-value { font-size: 24px; font-weight: bold; color: #10b981; }
    .credits-label { font-size: 11px; color: #71717a; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="logo">
    <div class="logo-icon">
      <svg fill="none" stroke="white" stroke-width="2" viewBox="0 0 24 24">
        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
      </svg>
    </div>
    <div class="logo-text">
      <h1>Auto Caller Pro</h1>
      <p>100% Local • Private • Yours</p>
    </div>
  </div>
  
  <div class="status">
    <div class="status-row">
      <span class="status-label">Server</span>
      <span class="status-value connected" id="serverStatus">Checking...</span>
    </div>
    <div class="status-row">
      <span class="status-label">API Keys</span>
      <span class="status-value" id="apiStatus">Not Set</span>
    </div>
  </div>
  
  <button class="btn" id="openApp">Open Dashboard</button>
  <button class="btn secondary" id="openSettings">Settings</button>
  
  <div class="credits">
    <div class="credits-value" id="creditsValue">---</div>
    <div class="credits-label">Credits Remaining</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
